<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>한동 자료함</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/app.css(v=4)}" rel="stylesheet">
    </head>
    <body>
        <main class="container py-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <div class="eyebrow">HANDONG · RESOURCE LIBRARY</div>
                    <h1>한동 자료함</h1>
                    <p class="page-description">수업 자료와 유용한 파일을 한곳에서 나누세요.</p>
                </div>
                <a class="btn btn-primary" th:href="@{/posts/new}">+ 자료 공유하기</a>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="ps-4">번호</th>
                                <th>제목</th>
                                <th>첨부</th>
                                <th>작성일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${posts}">
                                <td class="ps-4" th:text="${p.id}">1</td>
                                <td>
                                    <a th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}">제목</a>
                                </td>
                                <td th:text="${#lists.size(p.attachments)} + '개'">0개</td>
                                <td th:text="${#temporals.format(p.createdAt,'yyyy-MM-dd HH:mm')}">날짜</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(posts)}">
                                <td colspan="4" class="text-center text-secondary p-5">아직 공유된 자료가 없습니다. 첫 자료를 올려보세요.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </body>
</html>
