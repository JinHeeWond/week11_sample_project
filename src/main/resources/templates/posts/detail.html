<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>게시글 상세</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/app.css(v=4)}" rel="stylesheet">
    </head>
    <body>
        <main class="container py-5" style="max-width:900px">
            <a th:href="@{/posts}">← 자료함으로</a>
            <div class="card shadow-sm mt-3">
                <div class="card-body p-4">
                    <div class="eyebrow" th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}">작성일</div>
                    <h1 th:text="${post.title}">게시글 제목</h1>
                    <p class="post-content" th:text="${post.content}">게시글 내용</p>
                    <hr>
                    <h5>첨부파일
                        <span class="text-secondary" th:text="${#lists.size(post.attachments)}">0</span>
                    </h5>
                    <p class="text-secondary" th:if="${#lists.isEmpty(post.attachments)}">첨부파일이 없습니다.</p>
                    <ul class="list-group" th:if="${!#lists.isEmpty(post.attachments)}">
                        <li class="list-group-item attachment-row d-flex justify-content-between align-items-center gap-3" th:each="file : ${post.attachments}">
                            <div class="attachment-info">
                                <strong class="attachment-name" th:text="${file.originalFilename}">sample.pdf</strong>
                                <div class="attachment-meta">
                                    <span class="file-type" th:text="${file.contentType}">application/pdf</span>
                                    <span th:text="${file.fileSize &lt; 1024 ? file.fileSize + ' B' : (file.fileSize &lt; 1048576 ? #numbers.formatDecimal(file.fileSize / 1024.0, 1, 1) + ' KB' : #numbers.formatDecimal(file.fileSize / 1048576.0, 1, 1) + ' MB')}">크기</span>
                                </div>
                            </div>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/attachments/{id}/download(id=${file.id})}">파일 받기</a>
                        </li>
                    </ul>
                    <section class="preview-section" aria-label="첨부 이미지 미리보기">
                        <th:block th:each="file : ${post.attachments}">
                            <figure class="image-preview" th:if="${file.contentType == 'image/jpeg' or file.contentType == 'image/png' or file.contentType == 'image/gif'}">
                                <a th:href="@{/attachments/{id}/view(id=${file.id})}" target="_blank" rel="noopener">
                                    <img th:src="@{/attachments/{id}/view(id=${file.id})}"
                                         th:alt="${file.originalFilename}" loading="lazy"
                                         onerror="this.hidden = true; this.parentElement.nextElementSibling.hidden = false;">
                                </a>
                                <p class="preview-error" hidden>이미지를 불러올 수 없습니다. 파일이 삭제되었거나 사용할 수 없는 형식입니다.</p>
                                <figcaption th:text="${file.originalFilename}">첨부 이미지</figcaption>
                            </figure>
                        </th:block>
                    </section>
                    <div class="d-flex gap-2 mt-4">
                        <a class="btn btn-outline-secondary" th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
                        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" onsubmit="return confirm('게시글을 삭제할까요?')">
                            <button class="btn btn-outline-danger">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
